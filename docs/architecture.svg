<svg viewBox="0 0 700 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="1000" fill="#ffffff"/>

  <!-- connectors (drawn first, under nodes) -->
  <line x1="240" y1="80"  x2="240" y2="120" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="200" x2="240" y2="240" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="320" x2="240" y2="360" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="430" x2="240" y2="470" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="550" x2="240" y2="590" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="670" x2="240" y2="710" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="780" x2="240" y2="820" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="255" y="450" font-size="13" fill="#6b7280">No</text>
  <text x="255" y="800" font-size="13" fill="#6b7280">Yes</text>

  <!-- branch connectors -->
  <line x1="390" y1="395" x2="460" y2="395" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="385" font-size="13" font-weight="bold" fill="#c2410c">Yes</text>

  <line x1="390" y1="745" x2="460" y2="745" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="735" font-size="13" font-weight="bold" fill="#c2410c">No</text>

  <!-- 1. Incoming ticket -->
  <rect x="90" y="20" width="300" height="60" rx="10" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/>
  <text x="240" y="55" text-anchor="middle" font-size="16" fill="#333333">Incoming ticket</text>

  <!-- 2. Intent classifier -->
  <rect x="90" y="120" width="300" height="80" rx="10" fill="#d1f5ea" stroke="#0e9f6e" stroke-width="1.5"/>
  <text x="240" y="153" text-anchor="middle" font-size="16" font-weight="600" fill="#065f46">Intent classifier</text>
  <text x="240" y="176" text-anchor="middle" font-size="12" fill="#065f46">Bug · billing · feature · complaint</text>

  <!-- 3. Priority scorer -->
  <rect x="90" y="240" width="300" height="80" rx="10" fill="#d1f5ea" stroke="#0e9f6e" stroke-width="1.5"/>
  <text x="240" y="273" text-anchor="middle" font-size="16" font-weight="600" fill="#065f46">Priority scorer</text>
  <text x="240" y="296" text-anchor="middle" font-size="12" fill="#065f46">Sentiment + urgency signals</text>

  <!-- 4. Critical priority? -->
  <rect x="90" y="360" width="300" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="240" y="401" text-anchor="middle" font-size="16" font-weight="600" fill="#78350f">Critical priority?</text>

  <!-- 5. Escalate to human -->
  <rect x="460" y="360" width="200" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="401" text-anchor="middle" font-size="15" font-weight="600" fill="#7f1d1d">Escalate to human</text>

  <!-- 6. KB retrieval -->
  <rect x="90" y="470" width="300" height="80" rx="10" fill="#d1f5ea" stroke="#0e9f6e" stroke-width="1.5"/>
  <text x="240" y="503" text-anchor="middle" font-size="16" font-weight="600" fill="#065f46">KB retrieval</text>
  <text x="240" y="526" text-anchor="middle" font-size="12" fill="#065f46">Search FAQ + policy docs</text>

  <!-- 7. Response drafter -->
  <rect x="90" y="590" width="300" height="80" rx="10" fill="#d1f5ea" stroke="#0e9f6e" stroke-width="1.5"/>
  <text x="240" y="623" text-anchor="middle" font-size="16" font-weight="600" fill="#065f46">Response drafter</text>
  <text x="240" y="646" text-anchor="middle" font-size="12" fill="#065f46">Generate grounded reply</text>

  <!-- 8. Confidence gate -->
  <rect x="90" y="710" width="300" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="240" y="751" text-anchor="middle" font-size="16" font-weight="600" fill="#78350f">Confidence above threshold?</text>

  <!-- 9. Flag for review -->
  <rect x="460" y="710" width="200" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="751" text-anchor="middle" font-size="15" font-weight="600" fill="#7f1d1d">Flag for review</text>

  <!-- 10. Send drafted response -->
  <rect x="90" y="820" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="240" y="861" text-anchor="middle" font-size="16" font-weight="600" fill="#14532d">Send drafted response</text>

  <!-- legend -->
  <g font-size="13" fill="#4b5563">
    <rect x="90" y="930" width="14" height="14" rx="3" fill="#d1f5ea" stroke="#0e9f6e"/>
    <text x="110" y="941">Agent tool</text>

    <rect x="220" y="930" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="240" y="941">Decision gate</text>

    <rect x="370" y="930" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="390" y="941">Human handoff</text>

    <rect x="520" y="930" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <text x="540" y="941">Output</text>
  </g>
</svg>
